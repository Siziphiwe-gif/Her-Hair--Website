<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product &amp; Service Enquiries | Her Hair South Africa</title>
    <!-- SEO: Meta description for the Enquiry page -->
    <meta name="description" content="Enquire about premium wigs and professional wig maintenance services at Her Hair South Africa. Contact us for product information and service enquiries.">
    <!-- SEO: Keywords for the Enquiry page-->
    <meta name="keywords" content="Her Hair enquiries, wig enquiries, wig prices South Africa, wig maintenance enquiries, wig services">

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Header section -->
<header>
    <h1>Her Hair</h1>

    <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="products.html">Products</a>
    <a href="enquiry.html">Enquiry</a>
    <a href="contact.html">Contact</a>
</nav>

</header>

<!-- Main content of the Enquiry page -->
<main>

    <section class="enquiry-intro">
        <h2>Product and Service Enquiry</h2>
         <!-- Displays the wig selected by the customer -->
        <p id="selectedProduct"></p>

        <p>
            Interested in one of our wigs or wig maintenance services?
            Complete the enquiry form below and we will assist you.
        </p>
        <!-- Enquiry form -->
<form id="enquiryForm">


    <label for="fullname">Full Name:</label>
  <!-- Full name must contain at least 2 characters -->
    <input type="text"
       id="fullname"
       name="fullname"
       minlength="2"
       maxlength="100"
       title="Please enter your full name (at least 2 characters)"
       required>

     <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone Number:</label>
    <!-- Phone number must contain exactly 10 digits -->
    <input type="tel"
       id="phone"
       name="phone"
       pattern="[0-9]{10}"
       maxlength="10"
       title="Please enter a 10-digit phone number"
       required>

    <label for="enquiry-type">Type of Enquiry:</label>

<select id="enquiry-type" name="enquiry-type" required>
    <option value="">Select an option</option>
    <option value="product">Wig Product</option>
    <option value="maintenance">Wig Maintenance Service</option>
</select>
<label for="product-service">Product or Service:</label>

<select id="product-service" name="product-service" required>
    <option value="">Select a product or service</option>
    <option value="long-black-wig">Long Black Wig</option>
    <option value="burgundy-wig">Burgundy Wig</option>
    <option value="short-black-bob">Short Black Bob</option>
    <option value="lace-front-bob">Lace Front Bob</option>
    <option value="wig-wash">Wig Washing and Conditioning</option>
    <option value="wig-styling">Wig Styling</option>
    <option value="wig-treatment">Wig Treatment</option>
    <option value="wig-revamp">Wig Restoration and Revamping</option>
</select> 

<label for="message">Additional Message:</label>

<textarea id="message" name="message" rows="5"></textarea> 

<button type="submit">Submit Enquiry</button> 
<p id="enquiryResponse" role="status" aria-live="polite"></p>

</form>
   
</section>

</main> 
<!-- Footer section -->
<footer>
    <p>&copy; 2026 Her Hair. All rights reserved.</p>
</footer> 

<script src="assets/js/script.js"></script>
</body>
</html>

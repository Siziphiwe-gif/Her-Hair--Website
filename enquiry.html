<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Her Hair | Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header section -->
<header>
    <h1>Her Hair</h1>

    <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="products.html">Products</a>
    <a href="enquiry.html">Enquiry</a>
    <a href="contact.html">Contact</a>
</nav>

</header>

<!-- Main content of the Enquiry page -->
<main>

    <section class="enquiry-intro">
        <h2>Product and Service Enquiry</h2>

        <p>
            Interested in one of our wigs or wig maintenance services?
            Complete the enquiry form below and we will assist you.
        </p>
        <!-- Enquiry form -->
<form>


    <label for="fullname">Full Name:</label>
   <input type="text" id="fullname" name="fullname" required>

     <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="enquiry-type">Type of Enquiry:</label>

<select id="enquiry-type" name="enquiry-type" required>
    <option value="">Select an option</option>
    <option value="product">Wig Product</option>
    <option value="maintenance">Wig Maintenance Service</option>
</select>
<label for="product-service">Product or Service:</label>

<select id="product-service" name="product-service" required>
    <option value="">Select a product or service</option>
    <option value="long-black-wig">Long Black Wig</option>
    <option value="burgundy-wig">Burgundy Wig</option>
    <option value="short-black-bob">Short Black Bob</option>
    <option value="lace-front-bob">Lace Front Bob</option>
    <option value="wig-wash">Wig Washing and Conditioning</option>
    <option value="wig-styling">Wig Styling</option>
    <option value="wig-treatment">Wig Treatment</option>
    <option value="wig-revamp">Wig Restoration and Revamping</option>
</select> 

<label for="message">Additional Message:</label>

<textarea id="message" name="message" rows="5"></textarea> 

<button type="submit">Submit Enquiry</button> 

</form>
    </section>

</main> 
<!-- Footer section -->
<footer>
    <p>&copy; 2026 Her Hair. All rights reserved.</p>
</footer> 

</body>
</html>
